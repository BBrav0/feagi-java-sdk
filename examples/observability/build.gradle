plugins {
    id 'java'
    id 'application'
}

group = 'io.feagi.sdk.examples'
version = '0.1.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    implementation project(':sdk-core')
    implementation 'com.google.code.gson:gson:2.10.1'
}

application {
    mainClass = 'io.feagi.sdk.examples.observability.BasicMetrics'
}

tasks.register('runBasicMetrics', JavaExec) {
    group = 'Execution'
    description = 'Run the basic metrics example'
    mainClass = 'io.feagi.sdk.examples.observability.BasicMetrics'
    classpath = sourceSets.main.runtimeClasspath

    environment 'FEAGI_HOST', System.getenv('FEAGI_HOST') ?: 'localhost'
    environment 'FEAGI_REGISTRATION_PORT', System.getenv('FEAGI_REGISTRATION_PORT') ?: '30001'
    environment 'FEAGI_SENSORY_PORT', System.getenv('FEAGI_SENSORY_PORT') ?: '5555'
    environment 'FEAGI_MOTOR_PORT', System.getenv('FEAGI_MOTOR_PORT') ?: '5564'
    environment 'FEAGI_AGENT_ID', System.getenv('FEAGI_AGENT_ID') ?: 'metrics-agent-001'
}

tasks.register('runDataLogging', JavaExec) {
    group = 'Execution'
    description = 'Run the data logging example'
    mainClass = 'io.feagi.sdk.examples.observability.DataLogging'
    classpath = sourceSets.main.runtimeClasspath

    environment 'FEAGI_HOST', System.getenv('FEAGI_HOST') ?: 'localhost'
    environment 'FEAGI_REGISTRATION_PORT', System.getenv('FEAGI_REGISTRATION_PORT') ?: '30001'
    environment 'FEAGI_SENSORY_PORT', System.getenv('FEAGI_SENSORY_PORT') ?: '5555'
    environment 'FEAGI_MOTOR_PORT', System.getenv('FEAGI_MOTOR_PORT') ?: '5564'
    environment 'FEAGI_AGENT_ID', System.getenv('FEAGI_AGENT_ID') ?: 'logging-agent-001'
}
